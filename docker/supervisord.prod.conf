; =============================================================================
; supervisord config for the production daskomweb2 image.
;
; EXACTLY THREE programs, no scheduler:
;   1. web      -> FrankenPHP/Caddy serving Laravel (classic, non-worker mode)
;   2. reverb   -> Laravel Reverb websocket server on 0.0.0.0:8090
;   3. horizon  -> Laravel Horizon queue worker supervisor
;
; There is deliberately NO queue scheduler program here.
; =============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:web]
directory=/app
; FrankenPHP in classic mode: Caddy reads /etc/frankenphp/Caddyfile, whose
; `:8000` site uses the plain `php_server` directive (no worker).
command=/usr/local/bin/frankenphp run --config /etc/frankenphp/Caddyfile
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=1

[program:reverb]
directory=/app
command=/usr/local/bin/php /app/artisan reverb:start --host=0.0.0.0 --port=8090
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=2

[program:horizon]
directory=/app
command=/usr/local/bin/php /app/artisan horizon
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=3
