[supervisord]
nodaemon=true
user=root

[program:serve]
directory=/app  
# command=/usr/local/bin/frankenphp php-cli artisan octane:start --host=0.0.0.0 --port=8000 --watch
# `frankenphp php-cli <script>` treats the script as a frankenphp subcommand
# and exits 1, so the artisan server is started by the php binary directly.
command=/usr/local/bin/php artisan serve --host=0.0.0.0 --port=8000
# stdout_logfile=/var/log/supervisor/frankenphp.log
# stderr_logfile=/var/log/supervisor/frankenphp-error.log
autostart=true
autorestart=true
priority=1

[program:reverb]
directory=/app  
command=/usr/local/bin/php artisan reverb:start --host=0.0.0.0 --port=8090
# stdout_logfile=/var/log/supervisor/reverb.log
# stderr_logfile=/var/log/supervisor/reverb-error.log
autostart=true
autorestart=true
priority=2

[program:horizon]
directory=/app  
command=/usr/local/bin/php artisan horizon
# stdout_logfile=/var/log/supervisor/horizon.log
# stderr_logfile=/var/log/supervisor/horizon-error.log
autostart=true
autorestart=true
priority=3

; Laravel scheduler. Drives ai:prune-raw-responses (90 day raw_response
; retention) and ai:aggregate-metrics. Without it those never run.
[program:scheduler]
directory=/app
command=/usr/local/bin/php artisan schedule:work
autostart=true
autorestart=true
priority=4
